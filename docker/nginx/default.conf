server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Este container é publicado pelo nginx dos microservices em /app/admin/.
    location = /app/admin {
        return 302 /app/admin/;
    }

    location = /app {
        return 302 /app/admin/;
    }

    location = / {
        return 302 /app/admin/;
    }

    # SPA (ssr: false): rotas do cliente caem no index gerado pelo Nuxt.
    # $uri/index.html evita o 301 de diretório em rotas como /app/admin/dashboard.
    location /app/admin/ {
        try_files $uri $uri/index.html /app/admin/index.html;
    }

    location ~* ^/app/admin/_nuxt/.+\.(?:js|css|woff2?|png|jpe?g|gif|svg|webp|ico)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
