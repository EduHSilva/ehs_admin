# Sobe o painel administrativo conectado à rede do nginx dos microservices.
#
# O acesso normal é http://localhost/app/admin/ (via nginx). A porta 3000 é
# publicada apenas para depuração local e pode ser trocada/removida com
# ADMIN_UI_PORT.
#
# Requisitos:
#   1. A stack dos microservices precisa estar no ar.
#   2. A rede externa precisa existir (padrão: ehs_microservices_default).
#      Em produção (docker-compose.prod.yml) use
#      EHS_MICROSERVICES_NETWORK=ehs_microservices_backend.
#
# Uso:
#   docker compose up -d --build
#   docker compose logs -f admin-ui

services:
  admin-ui:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # O caminho /app/admin/ é fixo no Dockerfile e no nginx deste container.
        NUXT_APP_BASE_URL: /app/admin/
        # "/users" = mesma origem através do nginx dos microservices.
        NUXT_PUBLIC_USERS_API_URL: ${ADMIN_USERS_API_URL:-/users}
    image: ${ADMIN_UI_IMAGE:-ehs_admin-ui:local}
    container_name: admin-ui
    restart: unless-stopped
    expose:
      - "80"
    ports:
      - "${ADMIN_UI_PORT:-3000}:80"
    networks:
      default: {}
      ehs_microservices:
        aliases:
          - admin-ui

networks:
  ehs_microservices:
    external: true
    name: ${EHS_MICROSERVICES_NETWORK:-ehs_microservices_default}
